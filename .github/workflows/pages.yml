name: Deploy research notebook

on:
  push:
    branches:
      - pages

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out pages branch
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Determine base path
        shell: bash
        run: |
          REPOSITORY_NAME="${GITHUB_REPOSITORY#*/}"
          OWNER_NAME="${GITHUB_REPOSITORY_OWNER}"

          if [[ "${REPOSITORY_NAME}" == "${OWNER_NAME}.github.io" ]]; then
            BASE_PATH=""
          else
            BASE_PATH="/${REPOSITORY_NAME}"
          fi

          echo "NEXT_PUBLIC_BASE_PATH=${BASE_PATH}" >> "${GITHUB_ENV}"

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Verify static output
        shell: bash
        run: |
          test -d out
          test -f out/index.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
