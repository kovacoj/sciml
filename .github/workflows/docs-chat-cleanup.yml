name: Clean documentation chat queue

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete expired queue comments
        env:
          GH_TOKEN: ${{ github.token }}
          QUEUE_ISSUE: ${{ vars.SCIML_QUEUE_ISSUE }}
        run: |
          set -euo pipefail
          cutoff="$(date -u -d '24 hours ago' +'%Y-%m-%dT%H:%M:%SZ')"

          mapfile -t comment_ids < <(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/issues/${QUEUE_ISSUE}/comments?per_page=100" \
              --jq ".[] | select(.created_at < \"${cutoff}\") | select(.body | startswith(\"<!-- sciml-chat-request:\") or startswith(\"<!-- sciml-chat-response:\")) | .id"
          )

          for comment_id in "${comment_ids[@]}"; do
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}"
          done
