name: Deploy research notebook

on:
  push:
    branches:
      - pages

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out pages branch
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-notebooks.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install website dependencies
        run: npm ci

      - name: Install notebook dependencies
        run: |
          python -m pip install uv==0.8.2
          python -m pip install -r requirements-notebooks.txt

      - name: Export marimo notebooks
        run: ./scripts/export-notebooks.sh

      - name: Verify marimo source export
        run: |
          test -f \
            public/notebooks/laplacian-eigenmodes/index.html
          test -f \
            public/notebooks/thermodynamic-linear-algebra/index.html

      - name: Determine GitHub Pages base path
        shell: bash
        run: |
          REPOSITORY_NAME="${GITHUB_REPOSITORY#*/}"
          OWNER_NAME="${GITHUB_REPOSITORY_OWNER}"

          if [[ "${REPOSITORY_NAME}" == "${OWNER_NAME}.github.io" ]]; then
            BASE_PATH=""
          else
            BASE_PATH="/${REPOSITORY_NAME}"
          fi

          echo "NEXT_PUBLIC_BASE_PATH=${BASE_PATH}" >> "${GITHUB_ENV}"
          echo "Using base path: ${BASE_PATH:-/}"

      - name: Build combined static site
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Verify combined static output
        shell: bash
        run: |
          test -d out
          test -f out/index.html
          test -f \
            out/notebooks/laplacian-eigenmodes/index.html
          test -f \
            out/notebooks/thermodynamic-linear-algebra/index.html

          find out/notebooks/laplacian-eigenmodes \
            -maxdepth 2 \
            -type f \
            | sort

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
