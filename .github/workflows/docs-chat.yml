name: Documentation chat

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: write

jobs:
  answer:
    if: >-
      github.event.issue.number == fromJSON(vars.SCIML_QUEUE_ISSUE) &&
      github.event.comment.user.type != 'Bot' &&
      contains(
        github.event.comment.body,
        '<!-- sciml-chat-request:'
      ) &&
      !contains(
        github.event.comment.body,
        '<!-- sciml-chat-response:'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out documentation branch
        uses: actions/checkout@v6
        with:
          ref: pages

      - name: Process documentation question
        env:
          GH_TOKEN: ${{ github.token }}
          SIEMENS_LLM_API_KEY: ${{ secrets.SIEMENS_LLM_API_KEY }}
          SIEMENS_BASE_URL: https://api.siemens.com/llm/v1
          SIEMENS_MODEL: qwen-3.6-27b
          REQUEST_COMMENT: ${{ github.event.comment.body }}
          QUEUE_ISSUE: ${{ github.event.issue.number }}
          DOCUMENTATION_URL: https://kovacoj.github.io/sciml/llms-full.txt
        run: python3 scripts/docs_chat.py
